[package]
name = "CheckPatt"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
members = ["xtask"]

[dependencies]
iced = { version = "0.14.0", features = ["svg"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
dark-light = "3.0.0"
rand = "0.10.3"
toml = "1.1.8"
directories = "6.0.0" 
iced_aw = {version = "0.14.1", features = ["full"]}